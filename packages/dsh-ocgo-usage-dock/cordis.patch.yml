# dsh-ocgo-usage-dock bundle layer.
#
# `id` is both the Loader entry id and the settings namespace served to the
# browser half. `name` must match package.json. Defaults live on the Schemastery
# fields in src/config.ts; only the credential reference is stated here.
- insert:
    - id: ocgo-usage-dock
      name: '@hmilyld/dsh-ocgo-usage-dock'
      config:
        apiKeyEnv: OPENCODE_GO_API_KEY
