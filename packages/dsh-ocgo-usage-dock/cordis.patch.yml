# dsh-ocgo-usage-dock bundle layer.
#
# `id` is both the Loader entry id and the settings namespace served to the
# browser half. `name` must match package.json. Defaults live on the Schemastery
# fields in src/config.ts; this row only shows the shape a profile may override.
#
# apiKey is the deprecated compatibility field. New configurations should leave
# it empty and use apiKeyEnv + the credentials field in the plugin's settings
# page, so the secret never enters the settings document.
- insert:
    - id: ocgo-usage-dock
      name: '@hmilyld/dsh-ocgo-usage-dock'
      config:
        apiKey: ''
        apiKeyEnv: OPENCODE_GO_API_KEY
        refreshIntervalMs: 300000
        timeoutMs: 15000
        baseUrl: https://opencode.ai/zen/go/v1/usage
